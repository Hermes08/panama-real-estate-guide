  <script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"1. Posso ter dupla residência em Panamá e Espanha?","acceptedAnswer":{"@type":"Answer","text":"Sim, o visto não lucrativo e a Visa de Pensionado são legalmente compatíveis. No entanto, a designação de residência fiscal é crítica: você só pode ser residente fiscal em UM país. Se dividir o tempo 50/50, as autoridades fiscais podem considerá-lo residente fiscal do país onde mantém moradia permanente. Solução: manter residência primária no Panamá (propriedade em fideicomiso ou contrato de aluguel de longo prazo), alugar a curto prazo na Espanha (aluguéis turísticos, Airbnb, moradia corporativa). Documentar o Panamá como lar fiscal. A Espanha pode contestar isso sob a Beckham Law (que exige residência contínua); ausências maiores que 90 dias em um ano arriscam a revogação da Beckham Law. Recomendação: escolha um país primário para residência fiscal; use o outro para visitas prolongadas (mais de 90 dias por ano sob regras Schengen)."}},{"@type":"Question","name":"2. O que acontece com minha Visa de Pensionado se eu sair do Panamá por 6 meses?","acceptedAnswer":{"@type":"Answer","text":"A Visa de Pensionado não exige residência contínua; você pode se ausentar por períodos longos (inclusive anos) sem colocar o status em risco. A renovação anual é uma formalidade documental; enquanto o requisito de renda for mantido ($1.350/mês) e você renove no prazo, a residência permanece válida mesmo com viagens frequentes. Não há requisito de \"usar ou perder\". Compare isso com o visto Não Lucrativo da Espanha, que tecnicamente exige residência contínua (ausências maiores que 3 meses podem convidar escrutínio, embora a aplicação varie)."}},{"@type":"Question","name":"3. Se a Beckham Law da Espanha expirar após 2026, qual é minha obrigação fiscal?","acceptedAnswer":{"@type":"Answer","text":"Se você se registrar antes da expiração e completar o período de 5 anos, o regime fiscal se aplica durante os 5 anos completos independentemente de mudanças legais posteriores. Se a lei mudar no meio do seu período, seu registro individual normalmente fica com direitos adquiridos (embora o parlamento da Espanha possa legislar retroativamente, como visto com outras mudanças de lei fiscal). Pior cenário: você sai da Espanha antes do ano 5 ou enfrenta a tributação padrão espanhola (alíquotas progressivas de 25-45% + imposto sobre patrimônio) após a expiração da Beckham. Mitigação: considere o Panamá como residência reserva se a Beckham expirar prematuramente; ou antecipe compras de propriedades e investimentos enquanto estiver sob a Beckham para garantir as vantagens fiscais."}},{"@type":"Question","name":"4. Os pagamentos do Seguro Social dos EUA são tributados em Panamá e Espanha?","acceptedAnswer":{"@type":"Answer","text":"Panamá: o Seguro Social é um benefício de origem norte-americana; não residentes pagam zero imposto no Panamá sobre o Seguro Social (renda estrangeira isenta). Você ainda declara impostos nos EUA; o Seguro Social é tributável em nível federal (tipicamente 50-85% do benefício tributado conforme o limite de renda provisional), mas o Panamá não acrescenta nenhuma camada."}},{"@type":"Question","name":"5. Como o tratado fiscal EUA-Panamá afeta minha situação?","acceptedAnswer":{"@type":"Answer","text":"O tratado EUA-Panamá (assinado em 1986, reafirmado via orientação do IRS) isenta não residentes de tributação panamenha sobre renda de fonte estrangeira. Para cidadãos americanos residindo no Panamá, os benefícios incluem:"}},{"@type":"Question","name":"6. O que é um fideicomiso e preciso obrigatoriamente de um para comprar imóvel no Panamá?","acceptedAnswer":{"@type":"Answer","text":"Um fideicomiso é uma estrutura legal de trust onde você (estrangeiro) é o beneficiário efetivo mas um fiduciário (tipicamente um escritório de advocacia ou banco) detém o título. Vantagens:"}},{"@type":"Question","name":"8. Qual é o risco cambial de manter ativos em EUR na Espanha vs. USD no Panamá?","acceptedAnswer":{"@type":"Answer","text":"Risco Cambial no Panamá: mínimo. O Balboa panamenho = dólar americano (paridade 1:1, desde o acordo de dolarização de 1904). Não é necessária conversão cambial para cidadãos americanos; hedge natural em USD."}}],"url":"https://panamarealestateguide.com/pt/articles/panama-vs-spain-retirement.html"}</script>
