  <script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"1. Can I hold dual residency in Panama and Spain?","acceptedAnswer":{"@type":"Answer","text":"Yes, non-lucrative visa + Pensioner visa are compatible legally. However, tax residency designation is critical: you can only be tax-resident in ONE country. If you split time 50/50, tax authorities may deem you tax-resident in the country where you maintain permanent housing. Solution: Maintain primary residence in Panama (fideicomiso property or long-term rental lease), rent short-term in Spain (tourist rentals, Airbnb, corporate housing). Document Panama as tax home. Spain may challenge this under Beckham Law (which requires continuous residency); departures >90 days in a year risk Beckham Law revocation. Recommendation: Choose one primary country for tax residency; use the other for extended visits (90+ days annually under Schengen rules)."}},{"@type":"Question","name":"2. What happens to my Pensioner Visa if I leave Panama for 6 months?","acceptedAnswer":{"@type":"Answer","text":"Pensioner Visa does not require continuous residency; you can leave for extended periods (even years) without jeopardizing status. Annual renewal is a paperwork formality; as long as income requirement is maintained ($1,350/month) and you renew on schedule, residency remains valid even with frequent travel. No \"use it or lose it\" requirement. Contrast this to Spain's Non-Lucrative visa, which technically requires continuous residency (departures >3 months may invite scrutiny, though enforcement varies)."}},{"@type":"Question","name":"3. If Spain's Beckham Law expires post-2026, what's my tax liability?","acceptedAnswer":{"@type":"Answer","text":"If you register before expiration and complete the 5-year period, the tax regime applies for the full 5 years regardless of subsequent legal changes. If law changes mid-tenure, your individual registration typically grandfathered (though Spain's parliament can legislate retroactively, as seen with other tax law changes). Worst-case scenario: You exit Spain before year 5 or face standard Spanish taxation (25-45% progressive rates + wealth tax) post-Beckham expiration. Mitigation: Consider Panama as backup residency if Beckham expires prematurely; or front-load property purchases, investments while under Beckham to lock in tax advantages."}},{"@type":"Question","name":"4. Do US Social Security payments get taxed in Panama and Spain?","acceptedAnswer":{"@type":"Answer","text":"Panama: Social Security is a US-sourced benefit; non-residents pay zero Panama tax on Social Security (foreign income exempt). You still file US taxes; Social Security is taxable at federal level (typically 50-85% of benefit taxed depending on provisional income threshold), but Panama adds no layer."}},{"@type":"Question","name":"5. How does the US-Panama tax treaty affect my situation?","acceptedAnswer":{"@type":"Answer","text":"The US-Panama treaty (signed 1986, reaffirmed via IRS guidance) exempts non-residents from Panama taxation on foreign-source income. For US citizens residing in Panama, benefits include:"}},{"@type":"Question","name":"6. What is a fideicomiso and do I absolutely need one to buy property in Panama?","acceptedAnswer":{"@type":"Answer","text":"A fideicomiso is a legal trust structure where you (foreigner) are the beneficial owner but a trustee (typically a law firm or bank) holds title. Advantages:"}},{"@type":"Question","name":"8. What's the currency risk of holding EUR assets in Spain vs. USD in Panama?","acceptedAnswer":{"@type":"Answer","text":"Panama Currency Risk: Minimal. Panamanian Balboa = US dollar (1:1 peg, since 1904 dollarization agreement). No currency conversion needed for US citizens; natural USD hedge."}}],"url":"https://panamarealestateguide.com/articles/panama-vs-spain-retirement.html"}</script>
