  <script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"Will my US health insurance work in Panama?","acceptedAnswer":{"@type":"Answer","text":"Most US health insurance plans (including Medicare Advantage) don't cover care outside the US. You'll need either international insurance ($100–$250/month for primary coverage) or a local plan ($150–$400/month). Some retirees maintain a US plan for emergencies and flights back to the US, plus local Panamanian insurance for routine care. Negotiate this before you move—coverage decisions made in Panama are more expensive."}},{"@type":"Question","name":"Can I maintain a US bank account once I move to Panama?","acceptedAnswer":{"@type":"Answer","text":"Yes, but new account opening is harder post-move. Open accounts before you migrate. FATCA and FBAR filing are still required (all US citizens must file FBAR if they have over $10,000 in foreign accounts at any point during the year). Work with a US tax accountant who understands FATCA; filing incorrectly can result in penalties of 25–50% of the account balance."}},{"@type":"Question","name":"How do I ship my car to Panama?","acceptedAnswer":{"@type":"Answer","text":"Cost is $3,500–$5,500 via container. Import duty is 15–35% of value depending on age and type. Total landed cost for a $25,000 car: $28,500–$34,000. Most expats sell their US car and buy a used Japanese import here (Toyota, Honda, Mitsubishi popular and reliable). Consider shipping only if the car has sentimental value or specialty features you can't find locally."}},{"@type":"Question","name":"What's the residency path for a Floridian with a $400,000 home they want to rent out?","acceptedAnswer":{"@type":"Answer","text":"Investment Visa (property-based, immediate) or Friendly Nations (income-based, 2–4 weeks). Property purchase satisfies Investment Visa requirements. Friendly Nations requires $120,000 liquid reserves or $500/month passive income. If your home generates $2,000/month rental income, Friendly Nations is streamlined and cheaper than Investment Visa."}},{"@type":"Question","name":"Can I purchase real estate as a foreigner in Panama?","acceptedAnswer":{"@type":"Answer","text":"Yes. No ownership restrictions for non-residents. Foreign-held property is straightforward: hire a lawyer, sign a document in front of a notary, register with the land office. Process takes 4–6 weeks. Title is registered in your name (or your Panama corporation, for asset protection). Budget $3,000–$5,000 in lawyer/notary fees. No capital gains tax on the sale (territorial system applies to income, not gains)."}}],"url":"https://panamarealestateguide.com/articles/moving-to-panama-from-florida.html"}</script>
