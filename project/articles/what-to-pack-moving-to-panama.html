  <script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"Should I ship my car to Panama?","acceptedAnswer":{"@type":"Answer","text":"Rarely. Cars are expensive to ship ($1,200-$2,000) and subject to 50-100% import tariffs. A used car worth $15,000 in the US costs $22,500-$30,000 in tariffs alone. Buy a used car locally via OOQO, Autom, or Facebook Marketplace. Newer vehicles are more expensive in Panama, but used vehicles are often competitive with US prices once you factor in shipping and tariffs."}},{"@type":"Question","name":"Can I ship a motorcycle or ATV?","acceptedAnswer":{"@type":"Answer","text":"Yes, but with the same tariff complications as cars. Motorcycles face 50-75% tariffs. Shipping cost: $800-$1,500. Total cost of import: $1,600-$2,500 plus tariffs. Buying used locally is usually cheaper. Consider renting or buying locally."}},{"@type":"Question","name":"How do I pack fragile items like glassware or dishware?","acceptedAnswer":{"@type":"Answer","text":"Fragile items require professional packing. Most moving companies include fragile packing as part of their service. If you're using a direct shipper, hire a professional packer ($200-$400) to pack fragile items separately. Breakage during shipping is common; budget for 10-15% loss on fragile items unless fully insured."}},{"@type":"Question","name":"What if my container is damaged or lost during shipping?","acceptedAnswer":{"@type":"Answer","text":"Basic carrier liability covers $1,000-$5,000. All-risk insurance ($200-$400) covers full replacement value. If you're shipping high-value items, all-risk insurance is mandatory. File claims immediately upon discovery of damage; documentation and photographs are required."}},{"@type":"Question","name":"Can I ship plants or seeds to Panama?","acceptedAnswer":{"@type":"Answer","text":"Most plants and seeds require APHIS (Animal and Plant Health Inspection Service) permits and MINSA clearance in Panama. Agricultural restrictions are strict. Ship only hardy plants without soil; most expats buy plants locally after arrival. Cost of compliance: $200-$500 for permits."}},{"@type":"Question","name":"How long does customs clearance take in Colón?","acceptedAnswer":{"@type":"Answer","text":"Standard clearance: 3-7 business days. Expedited (via customs broker): 1-2 business days for additional $200-$300 fee. Incomplete paperwork extends clearance to 2-3 weeks. Hire a customs broker; the fee is worth the time savings."}}],"url":"https://panamarealestateguide.com/articles/what-to-pack-moving-to-panama.html"}</script>
