  <script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"Can I get residency in Panama on just Social Security income?","acceptedAnswer":{"@type":"Answer","text":"Yes, via the Friendly Nations Visa if you're a US/Canadian citizen. The requirement is $1,350/month *guaranteed income* (Social Security qualifies). You don't need to deposit a large lump sum—just proof that the income will continue. Processing: 2–4 weeks. However, not all nationalities qualify under Friendly Nations; investors from non-treaty countries must use the Investment Visa (property purchase or savings deposit of $120,000–200,000)."}},{"@type":"Question","name":"Is Mexico's fideicomiso (bank trust) a ripoff, and do I lose my property if the bank goes under?","acceptedAnswer":{"@type":"Answer","text":"The fideicomiso is a standard legal mechanism, not a ripoff. The bank holds legal title but you control beneficial ownership—you can rent, renovate, or sell without the bank's permission (except on sale, when they process the transfer). Banks are heavily regulated; a bank failure does not trigger loss of property (trust assets are segregated from the bank's balance sheet). Cost ($1,000–3,000 setup, $300/year) is higher than Panama's no-trust requirement, but the security is sound. The real cost is *illiquidity*—selling takes longer because the buyer must also set up a new trust."}},{"@type":"Question","name":"Will Mexico change its non-resident tax status and start taxing my US pension income?","acceptedAnswer":{"@type":"Answer","text":"Unlikely in the next 5–10 years. Mexico's tax code explicitly exempts non-residents from tax on foreign-source income. The risk is if you become a *tax resident* (typically after 4 years of continuous residence or 183+ days/year), at which point foreign income *can* become taxable. To stay non-resident indefinitely, you must leave Mexico for >183 days/year—impractical for retirees. Most retirees transition to permanent residency after 4 years and restructure their investments to avoid taxation (keep US-domiciled accounts, minimize Mexico-domiciled assets). Not foolproof, but manageable. Panama has no parallel risk because its territorial system applies to all residents uniformly."}},{"@type":"Question","name":"How do I handle US taxes if I move to Panama or Mexico? Do I still owe US federal tax?","acceptedAnswer":{"@type":"Answer","text":"Yes. US citizens/green-card holders owe federal tax on worldwide income regardless of where they live—including foreign pensions, Social Security, and portfolio income. Both Panama and Mexico are non-treaty countries (no tax treaty), so you cannot claim a foreign tax credit. However, US Social Security is only 50%–85% taxable at the federal level (depending on combined income), and both countries exempt foreign Social Security. So a retiree with only Social Security owes minimal US tax. The advantage of Panama/Mexico is state income tax (0% both) and wealth tax (0% both). Work with a US tax preparer familiar with expat taxes; many charge $500–1,500 for the added complexity."}},{"@type":"Question","name":"Which country is \"easier\" if I decide to move back to the US after 5 years?","acceptedAnswer":{"@type":"Answer","text":"Panama is slightly easier (no property entanglement, fewer bureaucratic ties). Mexico's fideicomiso + rental properties + local business registrations create more liquidation friction. However, both are non-binding: you can abandon either residency visa with 30 days' notice and keep property (if owned). The real friction is selling real estate—Mexico takes 12–24 months; Panama takes 6–12 months due to stronger buyer interest."}}],"url":"https://panamarealestateguide.com/articles/panama-vs-mexico-retirement.html"}</script>
