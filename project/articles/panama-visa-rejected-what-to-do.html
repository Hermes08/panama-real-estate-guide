  <script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"Can I reapply immediately after my visa is rejected?","acceptedAnswer":{"@type":"Answer","text":"No. You must wait 30 days from the rejection date before reapplying. However, you can file an appeal (recurso de reconsideración) during this 30-day window. Most reapplications are filed as appeals (with corrected documents) rather than entirely new applications. An immigration attorney will advise whether to appeal or reapply fresh."}},{"@type":"Question","name":"What happens to my money if my visa is rejected?","acceptedAnswer":{"@type":"Answer","text":"Government fees and attorney fees are non-refundable. If you had a Qualified Investor visa and the $500,000 is sitting in a Panama bank account as required, that money stays in your account—it's not confiscated. You can withdraw it or leave it there. The visa was denied; your bank account remains yours."}},{"@type":"Question","name":"Can I appeal a rejected visa if I don't have an immigration attorney?","acceptedAnswer":{"@type":"Answer","text":"Technically yes, but it's not recommended. You must file the appeal in Spanish, address specific legal points, and navigate immigration office procedures. An attorney costs $800-1,500 USD for an appeal but dramatically increases your success rate. Many applicants who appealed without an attorney were denied again. It's worth the investment."}},{"@type":"Question","name":"How long does an appeal take?","acceptedAnswer":{"@type":"Answer","text":"Immigration typically issues a decision on an appeal within 45-90 days. Some decisions come faster (30 days) if the issue is straightforward (e.g., you just needed to resubmit a translated document). The 30-day window to file the appeal plus 45-90 day processing means expect 3-4 months total from rejection to final appeal decision."}},{"@type":"Question","name":"If my appeal is denied, can I try again with a different visa category?","acceptedAnswer":{"@type":"Answer","text":"Yes. If you're rejected for Pensionado (insufficient income), you could potentially qualify for Qualified Investor or Friendly Nations if your circumstances change. You'd reapply for a different visa type. However, immigration will see your prior rejection on file; you must address why your second attempt is stronger. An attorney can help frame the new application to show how you've addressed the prior concerns."}},{"@type":"Question","name":"My documents are in my home country. Do I need to be in Panama to apply?","acceptedAnswer":{"@type":"Answer","text":"No, you can apply from abroad. You'll attend an immigration appointment at a Panama consulate in your home country (or visa application center). Some embassies (US, Canada, UK) process Panama visa applications. Check your nearest consulate's website. Processing timelines are similar: 45-90 days."}},{"@type":"Question","name":"What if my income is in cryptocurrency or from a digital business?","acceptedAnswer":{"@type":"Answer","text":"Immigration prefers traditional bank statements and clear, verifiable income sources. Cryptocurrency holdings and digital business income are harder to verify and more likely to trigger scrutiny. If your income is from a digital business: - Provide 2 years of bank statements showing regular deposits from your business - Include tax returns or business registration documents - Get an accountant's letter confirming your income legitimacy - Consider moving funds through a traditional bank account 2-3 months before applying to show a clean paper trail"}}],"url":"https://panamarealestateguide.com/articles/panama-visa-rejected-what-to-do.html"}</script>
