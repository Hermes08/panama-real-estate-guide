  <script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"1. Kann ich einen doppelten Wohnsitz in Panama und Spanien haben?","acceptedAnswer":{"@type":"Answer","text":"Ja, das nicht-erwerbstätige Visum und das Pensionado-Visum sind rechtlich vereinbar. Allerdings ist die Bestimmung des Steuerwohnsitzes entscheidend: Sie können nur in EINEM Land steueransässig sein. Wenn Sie die Zeit 50/50 aufteilen, können die Finanzbehörden Sie als steueransässig in dem Land einstufen, in dem Sie eine dauerhafte Unterkunft unterhalten. Lösung: Hauptwohnsitz in Panama beibehalten (Fideicomiso-Immobilie oder langfristiger Mietvertrag), kurzfristig in Spanien mieten (Touristenunterkünfte, Airbnb, Corporate Housing). Panama als steuerlichen Heimatort dokumentieren. Spanien kann dies unter dem Beckham Law anfechten (das eine durchgehende Ansässigkeit verlangt); Abwesenheiten von über 90 Tagen pro Jahr riskieren den Widerruf des Beckham Law. Empfehlung: Wählen Sie ein primäres Land für die Steueransässigkeit; nutzen Sie das andere für längere Besuche (mehr als 90 Tage pro Jahr unter den Schengen-Regeln)."}},{"@type":"Question","name":"2. Was passiert mit meinem Pensionado-Visum, wenn ich Panama für 6 Monate verlasse?","acceptedAnswer":{"@type":"Answer","text":"Das Pensionado-Visum erfordert keine durchgehende Ansässigkeit; Sie können längere Zeiträume (sogar Jahre) abwesend sein, ohne den Status zu gefährden. Die jährliche Verlängerung ist eine dokumentarische Formalität; solange die Einkommensanforderung erfüllt bleibt ($1.350/Monat) und Sie fristgerecht verlängern, bleibt der Wohnsitz auch bei häufigen Reisen gültig. Es gibt keine \"use it or lose it\"-Anforderung. Vergleichen Sie dies mit dem nicht-erwerbstätigen Visum Spaniens, das technisch eine durchgehende Ansässigkeit verlangt (Abwesenheiten von über 3 Monaten können Prüfungen einladen, obwohl die Durchsetzung variiert)."}},{"@type":"Question","name":"3. Wenn das Beckham Law Spaniens nach 2026 ausläuft, wie hoch ist meine Steuerlast?","acceptedAnswer":{"@type":"Answer","text":"Wenn Sie sich vor dem Ablauf registrieren und den 5-Jahres-Zeitraum abschließen, gilt das Steuerregime für die vollen 5 Jahre unabhängig von späteren Gesetzesänderungen. Wenn sich das Gesetz während Ihrer Laufzeit ändert, ist Ihre individuelle Registrierung in der Regel bestandsgeschützt (obwohl das spanische Parlament rückwirkend gesetzgeben kann, wie bei anderen Steuergesetzänderungen zu sehen war). Schlimmster Fall: Sie verlassen Spanien vor Jahr 5 oder sehen sich nach Ablauf von Beckham der spanischen Standardbesteuerung gegenüber (progressive Sätze 25-45% + Vermögensteuer). Minderung: Erwägen Sie Panama als Ausweichwohnsitz, falls Beckham vorzeitig endet; oder ziehen Sie Immobilienkäufe und Investitionen während der Beckham-Zeit vor, um die Steuervorteile zu sichern."}},{"@type":"Question","name":"4. Werden US-Sozialversicherungszahlungen in Panama und Spanien besteuert?","acceptedAnswer":{"@type":"Answer","text":"Panama: Die Sozialversicherung ist eine Leistung aus US-Quelle; Nichtansässige zahlen in Panama keine Steuern auf die Sozialversicherung (ausländisches Einkommen befreit). Sie reichen weiterhin US-Steuern ein; die Sozialversicherung ist auf Bundesebene steuerpflichtig (typischerweise werden 50-85% der Leistung je nach vorläufiger Einkommensgrenze besteuert), aber Panama fügt keine zusätzliche Ebene hinzu."}},{"@type":"Question","name":"5. Wie wirkt sich das Steuerabkommen zwischen den USA und Panama auf meine Situation aus?","acceptedAnswer":{"@type":"Answer","text":"Das US-Panama-Abkommen (unterzeichnet 1986, bestätigt durch IRS-Leitlinien) befreit Nichtansässige von der panamaischen Besteuerung von Einkünften aus ausländischen Quellen. Für US-Bürger mit Wohnsitz in Panama umfassen die Vorteile:"}},{"@type":"Question","name":"6. Was ist ein Fideicomiso und brauche ich unbedingt einen, um eine Immobilie in Panama zu kaufen?","acceptedAnswer":{"@type":"Answer","text":"Ein Fideicomiso ist eine rechtliche Trust-Struktur, bei der Sie (Ausländer) der wirtschaftliche Eigentümer sind, aber ein Treuhänder (typischerweise eine Anwaltskanzlei oder Bank) den Titel hält. Vorteile:"}},{"@type":"Question","name":"8. Wie hoch ist das Währungsrisiko, EUR-Vermögen in Spanien vs. USD in Panama zu halten?","acceptedAnswer":{"@type":"Answer","text":"Währungsrisiko in Panama: Minimal. Der panamaische Balboa = US-Dollar (Parität 1:1, seit dem Dollarisierungsabkommen von 1904). Keine Währungsumrechnung erforderlich für US-Bürger; natürliche USD-Absicherung."}}],"url":"https://panamarealestateguide.com/de/articles/panama-vs-spain-retirement.html"}</script>
