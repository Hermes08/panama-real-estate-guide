  <script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"1. ¿Puedo tener doble residencia en Panamá y España?","acceptedAnswer":{"@type":"Answer","text":"Sí, la visa no lucrativa y la Visa de Pensionado son legalmente compatibles. Sin embargo, la designación de residencia fiscal es crítica: solo puedes ser residente fiscal en UN país. Si divides el tiempo 50/50, las autoridades fiscales pueden considerarte residente fiscal del país donde mantienes vivienda permanente. Solución: mantener residencia primaria en Panamá (propiedad en fideicomiso o contrato de arrendamiento de largo plazo), alquilar a corto plazo en España (alquileres turísticos, Airbnb, vivienda corporativa). Documentar a Panamá como hogar fiscal. España puede impugnar esto bajo la Beckham Law (que exige residencia continua); ausencias mayores a 90 días en un año arriesgan la revocación de la Beckham Law. Recomendación: elige un país primario para residencia fiscal; usa el otro para visitas extendidas (más de 90 días al año bajo reglas Schengen)."}},{"@type":"Question","name":"2. ¿Qué pasa con mi Visa de Pensionado si salgo de Panamá por 6 meses?","acceptedAnswer":{"@type":"Answer","text":"La Visa de Pensionado no requiere residencia continua; puedes ausentarte por períodos largos (incluso años) sin poner en riesgo el estatus. La renovación anual es una formalidad documental; mientras se mantenga el requisito de ingreso ($1,350/mes) y renueves a tiempo, la residencia se mantiene válida incluso con viajes frecuentes. No hay requisito de \"úsalo o piérdelo\". Contrasta esto con la visa No Lucrativa de España, que técnicamente requiere residencia continua (ausencias mayores a 3 meses pueden invitar escrutinio, aunque la aplicación varía)."}},{"@type":"Question","name":"3. Si la Beckham Law de España expira después de 2026, ¿cuál es mi obligación fiscal?","acceptedAnswer":{"@type":"Answer","text":"Si te registras antes de la expiración y completas el período de 5 años, el régimen fiscal se aplica durante los 5 años completos sin importar cambios legales posteriores. Si la ley cambia a mitad de tu período, tu registro individual normalmente queda con derechos adquiridos (aunque el parlamento de España puede legislar de forma retroactiva, como se ha visto con otros cambios de ley fiscal). Peor escenario: sales de España antes del año 5 o enfrentas la tributación estándar española (tasas progresivas de 25-45% + impuesto al patrimonio) tras la expiración de Beckham. Mitigación: considera a Panamá como residencia de respaldo si Beckham expira prematuramente; o adelanta compras de propiedades e inversiones mientras estás bajo Beckham para asegurar las ventajas fiscales."}},{"@type":"Question","name":"4. ¿Los pagos del Seguro Social de EE. UU. se gravan en Panamá y España?","acceptedAnswer":{"@type":"Answer","text":"Panamá: el Seguro Social es un beneficio de origen estadounidense; los no residentes pagan cero impuesto en Panamá sobre el Seguro Social (ingresos extranjeros exentos). Sigues declarando impuestos en EE. UU.; el Seguro Social es gravable a nivel federal (típicamente 50-85% del beneficio gravado según el umbral de ingreso provisional), pero Panamá no agrega ninguna capa."}},{"@type":"Question","name":"5. ¿Cómo afecta el tratado fiscal EE. UU.-Panamá mi situación?","acceptedAnswer":{"@type":"Answer","text":"El tratado EE. UU.-Panamá (firmado en 1986, reafirmado vía orientación del IRS) exime a los no residentes de tributación panameña sobre ingresos de fuente extranjera. Para ciudadanos estadounidenses residiendo en Panamá, los beneficios incluyen:"}},{"@type":"Question","name":"6. ¿Qué es un fideicomiso y necesito uno obligatoriamente para comprar propiedad en Panamá?","acceptedAnswer":{"@type":"Answer","text":"Un fideicomiso es una estructura legal de trust donde tú (extranjero) eres el beneficiario efectivo pero un fiduciario (típicamente un bufete o banco) ostenta el título. Ventajas:"}},{"@type":"Question","name":"8. ¿Cuál es el riesgo cambiario de mantener activos en EUR en España vs. USD en Panamá?","acceptedAnswer":{"@type":"Answer","text":"Riesgo Cambiario en Panamá: mínimo. El Balboa panameño = dólar estadounidense (paridad 1:1, desde el acuerdo de dolarización de 1904). No se requiere conversión cambiaria para ciudadanos estadounidenses; cobertura natural en USD."}}],"url":"https://panamarealestateguide.com/es/articles/panama-vs-spain-retirement.html"}</script>
