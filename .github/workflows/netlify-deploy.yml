name: Deploy to Netlify

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Once a day at 06:00 UTC (01:00 Panama).
    - cron: '0 6 * * *'

permissions:
  contents: read

concurrency:
  group: netlify-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Cutover (2026-07-31): production now builds and publishes the v2
      # Next.js/Supabase app, not the v1 static site. netlify.toml's [build]
      # (base=v2, command, publish, @netlify/plugin-nextjs) is now the
      # source of truth for the build — `netlify deploy` (no --dir) runs it
      # rather than this workflow manually invoking v1's build-*/inject-*
      # scripts and pushing a pre-built `project/` directory (the previous
      # approach, which this workflow used until today, and which is also
      # why the first deploy after the cutover PR merged failed: netlify.toml
      # now declares @netlify/plugin-nextjs, and the old --dir=project
      # invocation never installed it anywhere). v1's source files and
      # scripts stay in the repo, just unused by this workflow now.
      - name: Install v2 dependencies
        working-directory: v2
        run: npm ci

      - name: Install Netlify CLI
        run: npm install -g netlify-cli@17

      # Push runtime env vars into Netlify so the Functions (lead-submit.mjs,
      # calendly-webhook.mjs) can read META_CAPI_TOKEN, CRM_API_*, CALENDLY_*.
      # Unrelated to the v1/v2 cutover — these serverless functions are
      # shared infrastructure, not part of either static/app build.
      - name: Sync function env vars to Netlify (via API)
        # Non-fatal: this only keeps serverless-function env vars in sync. The
        # deploy below does not depend on it, and account_slug resolution can
        # transiently fail — never let it block production.
        continue-on-error: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          META_PIXEL_ID: ${{ secrets.META_PIXEL_ID }}
          META_CAPI_TOKEN: ${{ secrets.META_CAPI_TOKEN }}
          CRM_API_URL: ${{ secrets.CRM_API_URL }}
          CRM_API_KEY: ${{ secrets.CRM_API_KEY }}
          CALENDLY_WEBHOOK_SIGNING_KEY: ${{ secrets.CALENDLY_WEBHOOK_SIGNING_KEY }}
        run: |
          # Use the Netlify REST API directly. The env:set CLI subcommand does
          # not accept --site / --filter, so we POST to /accounts/{slug}/env
          # with a site_id query param. Idempotent — falls back to PATCH on
          # 400 "key already exists".
          ACCOUNT=$(curl -s -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
            "https://api.netlify.com/api/v1/sites/$NETLIFY_SITE_ID" | \
            python3 -c "import sys,json; print(json.load(sys.stdin).get('account_slug',''))")
          if [ -z "$ACCOUNT" ]; then
            echo "::error::Could not resolve account_slug from NETLIFY_SITE_ID"
            exit 1
          fi
          echo "account_slug=$ACCOUNT, site=$NETLIFY_SITE_ID"

          set_env() {
            local name="$1" value="$2"
            if [ -z "$value" ]; then echo "  - $name skipped"; return 0; fi
            local body
            body=$(VAL="$value" KEY="$name" python3 -c "import os,json; print(json.dumps([{'key':os.environ['KEY'],'values':[{'value':os.environ['VAL'],'context':'production'}]}]))")
            local code
            code=$(curl -s -o /tmp/r.json -w "%{http_code}" -X POST \
              -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.netlify.com/api/v1/accounts/$ACCOUNT/env?site_id=$NETLIFY_SITE_ID" \
              -d "$body")
            if [ "$code" = "201" ] || [ "$code" = "200" ]; then
              echo "  ✓ $name created"
            elif { [ "$code" = "400" ] || [ "$code" = "422" ]; } && grep -q "already exists" /tmp/r.json; then
              local pbody
              pbody=$(VAL="$value" python3 -c "import os,json; print(json.dumps({'context':'production','value':os.environ['VAL']}))")
              local code2
              code2=$(curl -s -o /tmp/r2.json -w "%{http_code}" -X PATCH \
                -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
                -H "Content-Type: application/json" \
                "https://api.netlify.com/api/v1/accounts/$ACCOUNT/env/$name?site_id=$NETLIFY_SITE_ID" \
                -d "$pbody")
              [ "$code2" = "200" ] && echo "  ↻ $name updated" || echo "  ✗ $name PATCH HTTP $code2: $(cat /tmp/r2.json)"
            else
              echo "  ✗ $name HTTP $code: $(cat /tmp/r.json)"
            fi
          }

          set_env META_PIXEL_ID                "$META_PIXEL_ID"
          set_env META_CAPI_TOKEN              "$META_CAPI_TOKEN"
          set_env CRM_API_URL                  "$CRM_API_URL"
          set_env CRM_API_KEY                  "$CRM_API_KEY"
          set_env CALENDLY_WEBHOOK_SIGNING_KEY "$CALENDLY_WEBHOOK_SIGNING_KEY"

      - name: Build + deploy v2 to Netlify (production)
        # No --dir, no --no-build: `netlify deploy` builds by default, which
        # runs netlify.toml's [build] (base=v2, command="npm run build",
        # publish=".next") plus @netlify/plugin-nextjs, then deploys the
        # result. The previous workflow's `--dir=project` skipped this build
        # step entirely and just uploaded a pre-built directory — that's what
        # made netlify.toml's [build] section dead code under the old
        # pipeline. Verified locally with `netlify build --offline`.
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          netlify deploy \
            --site="$NETLIFY_SITE_ID" \
            --auth="$NETLIFY_AUTH_TOKEN" \
            --prod \
            --message="GH Actions: ${{ github.sha }} on ${{ github.ref_name }}"
