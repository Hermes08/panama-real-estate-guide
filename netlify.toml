# 301: project detail pages live at /proyectos/, not /articles/proyectos/
[[redirects]]
  from = "/articles/proyectos/*"
  to = "/proyectos/:splat"
  status = 301
  force = true

# 301: legacy /articles/ slugs Google indexed that never shipped as files
# (no internal links, not in sitemap) -> closest live equivalent article.
# Clears the GSC "Not found (404)" bucket and preserves any residual equity.
# Point directly at the v2 destination (not the old v1 slug) so this stays a
# single hop after the v1->v2 cutover, instead of chaining through a v1 URL
# that itself now 301s.
[[redirects]]
  from = "/articles/condos-for-sale-panama-2026.html"
  to = "/buying/condos-for-sale-panama-buyers-guide"
  status = 301
  force = true

[[redirects]]
  from = "/articles/costa-del-este.html"
  to = "/buying/best-neighborhoods-panama-city-expats"
  status = 301
  force = true

[[redirects]]
  from = "/articles/pensionado-visa.html"
  to = "/living/retire-in-panama"
  status = 301
  force = true


# Four Systems operator dashboard: Basic Auth via edge function
[[edge_functions]]
  function = "dashboard-auth"
  path = "/dashboard/*"

[[edge_functions]]
  function = "dashboard-auth"
  path = "/dashboard"


# Per-jurisdiction cookie-consent banner (language-banner half removed
# 2026-07-31, T-18). Paths updated for the v2 cutover — /articles/* is gone
# (redirected away), replaced with the actual v2 route patterns.
[[edge_functions]]
  function = "geo-route"
  path = "/"

[[edge_functions]]
  function = "geo-route"
  path = "/buying/*"

[[edge_functions]]
  function = "geo-route"
  path = "/residency/*"

[[edge_functions]]
  function = "geo-route"
  path = "/money/*"

[[edge_functions]]
  function = "geo-route"
  path = "/living/*"

[[edge_functions]]
  function = "geo-route"
  path = "/areas/*"

[[edge_functions]]
  function = "geo-route"
  path = "/projects/*"
